<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFFICIAL SHOP ADMINISTRATION</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="splash">
    <div class="brand-badge">🏷</div>
    <strong>OFFICIAL SHOP ADMINISTRATION</strong>
    <div class="splash-loader"></div>
    <p id="splashStatus">A validar a sessão junto do Supabase…</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /*
     * index.html — router de entrada.
     * A sessão é SEMPRE validada pelo Supabase (GET /auth/v1/user);
     * nunca confiamos apenas no que existe no browser.
     */
    (async () => {
      const status = document.getElementById('splashStatus');

      if (!isSupabaseConfigured()) {
        status.textContent = 'Publishable Key não configurada em js/config.js. A redirecionar para o login…';
        setTimeout(() => window.location.replace('login.html'), 1500);
        return;
      }

      const user = await Auth.getCurrentUser();
      if (!user.ok) {
        window.location.replace('login.html');
        return;
      }

      const prof = await Auth.getCurrentProfile();
      if (!prof.ok || prof.data.active === false) {
        window.location.replace('login.html');
        return;
      }

      if (prof.data.role === 'admin' || prof.data.role === 'junior_admin') {
        window.location.replace('admin.html');
      } else if (prof.data.role === 'cashier') {
        window.location.replace('cashier.html');
      } else {
        status.textContent = 'Role desconhecida: ' + prof.data.role;
      }
    })();
  </script>
</body>
</html>
